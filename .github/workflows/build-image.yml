name: Build AURA OS image (debos, ARM64)

# Builds the preinstalled UTM disk image on GitHub's native ARM64 runners.
# Run it manually from the Actions tab, or by pushing a version tag (v1.0).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  image:
    name: UTM disk image (qcow2 + raw)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debos qemu-utils debootstrap python3 rsync systemd-container

      - name: Allow KVM access if present
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
          fi

      - name: Build image
        run: ./build/build-image.sh

      - name: Show artifacts
        run: ls -lh build/out/

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AURA-OS-1.0-arm64-image
          path: |
            build/out/AURA-OS-1.0-arm64.qcow2
            build/out/AURA-OS-1.0-arm64.sha256
          if-no-files-found: warn

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/out/AURA-OS-1.0-arm64.qcow2
            build/out/AURA-OS-1.0-arm64.sha256
          body: |
            🏔 **AURA OS** — preinstalled ARM64 disk image for UTM on Apple Silicon.

            **Install:** create an ARM64 "Virtualize" VM in UTM, remove the
            default drive, import `AURA-OS-1.0-arm64.qcow2`, and boot.
            (Full guide: docs/INSTALL-UTM.md)

            **First login:** user `aura`, password `aura` — you will be
            required to choose a new password immediately.
