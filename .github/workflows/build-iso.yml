name: Build AURA OS ISO (live-build, ARM64)

# Builds the bootable live/installer ISO on GitHub's native ARM64 runners
# inside an official ARM64 Debian 12 (bookworm) container so Debian's native
# live-build (1:20230502) and debootstrap produce an authentic bookworm ISO.

on:
  workflow_dispatch:
  push:
    branches: ["arena/3424d119-ai-os", "main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  iso:
    name: Live/installer ISO
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Build ISO inside ARM64 Debian 12 (bookworm)
        run: |
          set +e
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work \
            debian:bookworm bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                sudo live-build debootstrap debian-archive-keyring rsync \
                squashfs-tools xorriso grub-efi-arm64-bin mtools dosfstools \
                ca-certificates cpio fdisk
              ./build/build-iso.sh
            '
          RC=$?
          if [ $RC -ne 0 ] && [ -f build/out/build-iso.log ]; then
            MSG=$(tail -n 12 build/out/build-iso.log | tr '\n\r' '  ' | cut -c1-900)
            echo "::error title=build-iso-tail::$MSG"
          fi
          exit $RC

      - name: Show artifacts
        if: always()
        run: ls -lh build/out/ || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-OS-1.0-arm64-iso
          path: |
            build/out/AURA-OS-1.0-arm64.iso
            build/out/AURA-OS-1.0-arm64.iso.sha256
          if-no-files-found: warn

      - name: Publish ISO to GitHub Releases (v1.0-liquid-glass)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-liquid-glass
          name: "AURA OS 1.0 — Liquid Glass Blue Edition (ARM64 ISO)"
          prerelease: false
          files: |
            build/out/AURA-OS-1.0-arm64.iso
            build/out/AURA-OS-1.0-arm64.iso.sha256
          body: |
            🏔 **AURA OS 1.0 “Aurora Peaks” — Liquid Glass Blue Edition**
            Bootable ARM64 live/installer ISO for **UTM on Apple Silicon (M1/M2/M3/M4)**.

            ### Quick Start in UTM
            1. Download **`AURA-OS-1.0-arm64.iso`** below to your Mac's `~/Downloads`.
            2. Open **UTM → ＋ Create a New Virtual Machine → Virtualize → Linux**.
            3. **Uncheck** *Use Apple Virtualization*, browse to `AURA-OS-1.0-arm64.iso`, allocate **6144 MB** RAM & **4 CPU cores**, **32 GB+** drive, and boot.
            4. Double-click **Install AURA OS** on the desktop (or use the live desktop directly).
