# AURA OS login screen (lightdm-slick-greeter) — Liquid Glass Blue Edition
[Greeter]
background=/usr/share/backgrounds/aura/aura-dark-peaks.jpg
background-color=#050D1A
logo=/usr/share/pixmaps/aura-logo-symbol.svg
theme-name=AuraDark
icon-theme-name=AuraIcons
cursor-theme-name=AuraCursor
font-name=Rajdhani Medium 11
clock-format=%H:%M
draw-user-backgrounds=true
draw-grid=false
show-hostname=true
show-power=true
show-a11y=true
show-keyboard=true
show-clock=true
show-quit=true
panel-position=top
activate-numlock=false
