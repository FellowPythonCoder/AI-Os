# AURA OS — Celestia Shell split-pane configuration (tmux)
# Quick tips:
#   Ctrl+B then |   -> split pane vertically (side by side)
#   Ctrl+B then -   -> split pane horizontally (top / bottom)
#   Alt + Arrows    -> switch between panes (or click with the mouse!)
set -g mouse on
set -g default-terminal "screen-256color"
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1

# Intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# AURA Liquid Glass Blue status bar
set -g status-style "bg=#0B2345,fg=#F4F9FF"
set -g status-left "#[bg=#1677FF,fg=#F4F9FF,bold] 🏔 CELESTIA #[bg=#0B2345,fg=#55D6FF] "
set -g status-right "#[fg=#BDEBFF] #H #[bg=#1677FF,fg=#F4F9FF,bold] %H:%M "
setw -g window-status-current-style "bg=#1677FF,fg=#F4F9FF,bold"
set -g pane-border-style "fg=#0B2345"
set -g pane-active-border-style "fg=#55D6FF"
