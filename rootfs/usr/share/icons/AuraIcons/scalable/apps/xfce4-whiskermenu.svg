<?xml version="1.0" encoding="UTF-8"?>
<!-- AURA OS Liquid Glass Blue Edition — Signature Blue Mountain Icon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgNavy" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0B2345"/>
      <stop offset="1" stop-color="#11386E"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="0.52" cy="0.36" r="0.56">
      <stop offset="0" stop-color="#55D6FF" stop-opacity="0.52"/>
      <stop offset="0.55" stop-color="#1677FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55D6FF"/>
      <stop offset="1" stop-color="#1677FF"/>
    </linearGradient>
    <linearGradient id="midPeak" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#BDEBFF"/>
      <stop offset="0.55" stop-color="#48B8FF"/>
      <stop offset="1" stop-color="#0E4FB5"/>
    </linearGradient>
    <linearGradient id="mainPeakLit" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F4F9FF"/>
      <stop offset="0.48" stop-color="#BDEBFF"/>
      <stop offset="1" stop-color="#55D6FF"/>
    </linearGradient>
    <linearGradient id="mainPeakShade" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#55D6FF"/>
      <stop offset="0.5" stop-color="#1677FF"/>
      <stop offset="1" stop-color="#0B2345"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F9FF" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#BDEBFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#55D6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F9FF" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#55D6FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1677FF" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="6" y="6" width="244" height="244" rx="56"/>
    </clipPath>
  </defs>
  <!-- Ambient outer shadow -->
  <rect x="10" y="14" width="236" height="234" rx="54" fill="#030A14" opacity="0.48"/>
  <g clip-path="url(#squircle)">
    <!-- Deep midnight-to-ocean base -->
    <rect x="6" y="6" width="244" height="244" fill="url(#bgNavy)"/>
    <!-- Luminous cyan horizon bloom -->
    <circle cx="132" cy="96" r="126" fill="url(#horizonGlow)"/>
    <!-- Subtle icy halo orb -->
    <circle cx="176" cy="72" r="18" fill="#F4F9FF" opacity="0.92"/>
    <circle cx="176" cy="72" r="28" fill="#55D6FF" opacity="0.22"/>
    <!-- Far atmospheric mountain range -->
    <path d="M-8 214 L58 118 L104 158 L166 102 L264 214 Z" fill="url(#farPeak)" opacity="0.58"/>
    <!-- Mid translucent crystal ridge -->
    <path d="M120 232 L182 114 L258 232 Z" fill="url(#midPeak)" opacity="0.88"/>
    <!-- Signature hero peak (shadow under-layer) -->
    <path d="M12 246 L108 82 L212 246 Z" fill="#051020" opacity="0.42"/>
    <!-- Signature hero peak — sunlit left facet -->
    <path d="M14 244 L108 76 L132 152 L98 184 L112 244 Z" fill="url(#mainPeakLit)"/>
    <!-- Signature hero peak — deep liquid-glass right facet -->
    <path d="M108 76 L208 244 L112 244 L98 184 L132 152 Z" fill="url(#mainPeakShade)"/>
    <!-- Icy cyan ridge crest highlight -->
    <path d="M46 188 L108 76 L168 178" fill="none" stroke="#F4F9FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Translucent foreground glass mist bar -->
    <rect x="6" y="206" width="244" height="44" fill="#071426" opacity="0.42"/>
    <path d="M24 216 H232" stroke="#55D6FF" stroke-width="1.6" stroke-opacity="0.45"/>
    <!-- Top Liquid Glass specular reflection arc -->
    <path d="M6 6 H250 V98 C190 120 72 118 6 88 Z" fill="url(#glassSheen)"/>
  </g>
  <!-- Outer luminous Liquid Glass rim -->
  <rect x="6" y="6" width="244" height="244" rx="56" fill="none" stroke="url(#rimStroke)" stroke-width="2.5"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" fill="none" stroke="#F4F9FF" stroke-opacity="0.14" stroke-width="1"/>
</svg>
