<?xml version="1.0" encoding="UTF-8"?>
<!-- AURA OS — Main Geometric Angular Mountain Logo (Dark-Blue Glass Tile) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#050D1A"/>
      <stop offset="0.55" stop-color="#081A38"/>
      <stop offset="1" stop-color="#0D2C5E"/>
    </linearGradient>
    <radialGradient id="apexGlow" cx="0.5" cy="0.38" r="0.52">
      <stop offset="0" stop-color="#55D6FF" stop-opacity="0.58"/>
      <stop offset="0.48" stop-color="#1677FF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#050D1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftBlade" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F4F9FF"/>
      <stop offset="0.28" stop-color="#55D6FF"/>
      <stop offset="1" stop-color="#1677FF"/>
    </linearGradient>
    <linearGradient id="rightBlade" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#55D6FF"/>
      <stop offset="0.45" stop-color="#1677FF"/>
      <stop offset="1" stop-color="#0A2E6E"/>
    </linearGradient>
    <linearGradient id="innerFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BDEBFF"/>
      <stop offset="0.5" stop-color="#38B6FF"/>
      <stop offset="1" stop-color="#0E48A8"/>
    </linearGradient>
    <linearGradient id="rimGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55D6FF" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#1677FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#BDEBFF" stop-opacity="0.28"/>
    </linearGradient>
    <clipPath id="sq">
      <rect x="6" y="6" width="244" height="244" rx="56"/>
    </clipPath>
  </defs>
  <rect x="10" y="14" width="236" height="234" rx="54" fill="#02060D" opacity="0.55"/>
  <g clip-path="url(#sq)">
    <rect x="6" y="6" width="244" height="244" fill="url(#bgDark)"/>
    <circle cx="128" cy="104" r="124" fill="url(#apexGlow)"/>
    <!-- Geometric Angular Mountain Symbol:
         Left ascending blade + inner angular cut + right faceted peak -->
    <!-- Shadow under-layer -->
    <polygon points="128,44 42,202 88,202 128,124 152,168 122,168 106,202 214,202" fill="#020814" opacity="0.55"/>
    <!-- Left luminous ascending wing -->
    <polygon points="128,38 40,198 86,198 128,116 144,146 164,112" fill="url(#leftBlade)"/>
    <!-- Secondary inner ridge facet -->
    <polygon points="128,116 102,166 142,166 162,198 182,198 144,132" fill="url(#innerFacet)"/>
    <!-- Right deep electric-blue wing -->
    <polygon points="128,38 164,112 144,146 174,198 216,198" fill="url(#rightBlade)"/>
    <!-- Razor apex highlight -->
    <polyline points="62,158 128,38 194,158" fill="none" stroke="#F4F9FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>
  <rect x="6" y="6" width="244" height="244" rx="56" fill="none" stroke="url(#rimGlow)" stroke-width="2.4"/>
</svg>
