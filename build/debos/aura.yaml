# AURA OS debos recipe — preinstalled ARM64 disk image for UTM.
# GENERATED by tools/render_debos_recipe.py from build/packages/*.txt.
# Build with:  ./build/build-image.sh        (ARM64 Debian/Ubuntu host)

architecture: arm64

actions:
  # Partition first so every later step writes straight into the image.
  - action: image-partition
    description: Create GPT disk (EFI + root)
    imagename: AURA-OS-1.0-arm64.img
    imagesize: 12GB
    partitiontype: GPT
    mountpoints:
      - mountpoint: /
        partition: root
        options: [x-systemd.growfs]
      - mountpoint: /boot/efi
        partition: esp
    partitions:
      - name: esp
        fs: fat32
        start: 0%
        end: 256MB
        label: efi
        flags: [esp]
      - name: root
        fs: ext4
        start: 256MB
        end: 100%
        label: rootfs

  - action: debootstrap
    description: Bootstrap Debian bookworm (arm64)
    suite: bookworm
    components: [main, contrib, non-free-firmware]
    mirror: https://deb.debian.org/debian
    variant: minbase

  - action: apt
    description: Install AURA OS packages (core + boot)
    recommends: false
    packages:
      - systemd
      - systemd-sysv
      - dbus
      - sudo
      - locales
      - tzdata
      - keyboard-configuration
      - console-setup
      - polkitd
      - policykit-1-gnome
      - udisks2
      - gvfs
      - gvfs-fuse
      - xdg-utils
      - xdg-user-dirs
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - desktop-file-utils
      - shared-mime-info
      - ca-certificates
      - gnupg
      - curl
      - wget
      - openssh-client
      - rsync
      - bash-completion
      - man-db
      - less
      - nano
      - command-not-found
      - ufw
      - gufw
      - network-manager
      - network-manager-gnome
      - wpasupplicant
      - iw
      - dnsmasq-base
      - iptables
      - spice-vdagent
      - qemu-guest-agent
      - xorg
      - xserver-xorg-input-libinput
      - lightdm
      - lightdm-gtk-greeter
      - lightdm-slick-greeter
      - Plymouth
      - mesa-utils
      - xfce4-panel
      - xfce4-session
      - xfce4-settings
      - xfwm4
      - xfdesktop4
      - xfconf
      - thunar
      - thunar-volman
      - thunar-archive-plugin
      - tumbler
      - xfce4-appfinder
      - xfce4-notifyd
      - xfce4-power-manager
      - xfce4-screensaver
      - xfce4-screenshooter
      - xfce4-taskmanager
      - xfce4-terminal
      - xfce4-whiskermenu-plugin
      - xfce4-appmenu-plugin
      - appmenu-gtk3-module
      - xfce4-clipman-plugin
      - xfce4-pulseaudio-plugin
      - mousepad
      - ristretto
      - Parole
      - orage
      - catfish
      - plank
      - libcanberra-gtk3-module
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - wireplumber
      - pavucontrol
      - alsa-utils
      - firefox-esr
      - geany
      - galculator
      - xarchiver
      - evince
      - uget
      - timeshift
      - fonts-inter
      - fonts-jetbrains-mono
      - fonts-noto-core
      - fonts-noto-color-emoji
      - fonts-dejavu
      - adwaita-icon-theme
      - librsvg2-bin
      - imagemagick
      - python3
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gtk-3.0
      - python3-pip-whl
      - pipx
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - fzf
      - git
      - build-essential
      - pkg-config
      - cmake
      - gdb
      - python3-venv
      - python3-dev
      - nodejs
      - npm
      - tmux
      - vim
      - htop
      - btop
      - tree
      - ripgrep
      - fd-find
      - bat
      - jq
      - zip
      - unzip
      - p7zip-full
      - flatpak
      - linux-image-arm64
      - initramfs-tools
      - grub-efi-arm64
      - grub-common
      - efibootmgr
      - dosfstools
      - e2fsprogs
      - parted

  - action: overlay
    description: AURA OS overlay (themes, apps, Celestia, branding)
    source: ../../rootfs
    destination: /

  - action: run
    description: Install GRUB for UEFI (removable media path — UTM-safe)
    chroot: true
    command: |
      set -e
      echo aura-os > /etc/hostname
      grub-install --target=arm64-efi --efi-directory=/boot/efi \
                   --bootloader-id=AURA --removable --no-nvram
      mkdir -p /etc/default/grub.d
      update-grub

  - action: run
    description: Create the default user and finalize AURA
    chroot: true
    command: |
      set -e
      useradd -m -s /bin/zsh -c "AURA User" \
              -G sudo,audio,video,plugdev,netdev,input,cdrom aura
      echo "aura:aura" | chpasswd
      chage -d 0 aura   # force a password change at first login
      /usr/share/aura/finalize.sh --user aura
      apt-get clean

  - action: run
    description: Tidy the image
    chroot: true
    command: |
      rm -rf /var/log/* /tmp/* /var/tmp/* 2>/dev/null || true
      truncate -s 0 /etc/machine-id || true
      rm -f /var/lib/dbus/machine-id || true
