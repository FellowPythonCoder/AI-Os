<?xml version="1.0" encoding="UTF-8"?>
<!-- AURA OS logo — blue mountain mark on gradient tile. Original artwork, MIT licensed with the project. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a6b"/>
      <stop offset="0.55" stop-color="#1450c8"/>
      <stop offset="1" stop-color="#2ea8e8"/>
    </linearGradient>
    <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc7f5"/>
      <stop offset="1" stop-color="#3f8fe0"/>
    </linearGradient>
    <linearGradient id="peakNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe9fb"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="4" y="4" width="248" height="248" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="4" y="4" width="248" height="248" fill="url(#tile)"/>
    <!-- horizon glow -->
    <ellipse cx="178" cy="86" rx="86" ry="60" fill="#8fd8ff" opacity="0.28"/>
    <!-- sun -->
    <circle cx="182" cy="78" r="21" fill="#eaf7ff"/>
    <!-- far range -->
    <path d="M-10 208 L66 116 L112 164 L158 108 L266 208 Z" fill="url(#peakFar)" opacity="0.85"/>
    <!-- near range -->
    <path d="M-10 252 L92 128 L146 184 L196 140 L266 252 Z" fill="url(#peakNear)"/>
    <!-- snow ridge highlight -->
    <path d="M92 128 L112 152 L99 156 L88 146 L76 154 Z" fill="#ffffff"/>
    <path d="M196 140 L210 157 L199 160 L190 151 L181 158 Z" fill="#ffffff"/>
    <!-- shaded face -->
    <path d="M92 128 L146 184 L196 140 L266 252 L92 252 Z" fill="#9fd2f2" opacity="0.35"/>
  </g>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
</svg>
